services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:?GATEWAY_API_KEY must be set in .env}
      REDIS_URL: redis://redis:6379
      LLM_GATEWAY_CONFIG: ${LLM_GATEWAY_CONFIG:?LLM_GATEWAY_CONFIG must be set in .env}
      GEMINI_ACCOUNT_1_API_KEY: ${GEMINI_ACCOUNT_1_API_KEY:-}
      GEMINI_ACCOUNT_2_API_KEY: ${GEMINI_ACCOUNT_2_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      GATEWAY_REQUEST_BODY_LIMIT_BYTES: ${GATEWAY_REQUEST_BODY_LIMIT_BYTES:-1048576}
      OPENROUTER_HTTP_REFERER: ${OPENROUTER_HTTP_REFERER:-}
      OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME:-LLM Gateway}
    read_only: true
    tmpfs:
      - /tmp

volumes:
  redis-data:
